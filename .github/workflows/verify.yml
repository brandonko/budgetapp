name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    name: Regression (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run all Python and JavaScript regressions
        run: python scripts/verify.py

  browser:
    name: Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install browser test tools
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run required suites and real browser smoke tests
        run: python scripts/verify.py --browser
      - name: Keep synthetic browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
